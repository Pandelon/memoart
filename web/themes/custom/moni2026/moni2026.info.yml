name: moni2026
type: theme
description: 'Me.Mo Foto 2026 – pure CSS téma (Bootstrap CSS/JS nélkül), a memo téma szerkezetével.'
core_version_requirement: ^10.3 || ^11
# Önálló téma: a bootstrap5 frontend template-jei, preprocess hookjai és
# Drupal-komponens CSS-e, valamint a használt stable9 template-ek át lettek
# véve, a Bootstrap framework nélkül.
base theme: false
screenshot: screenshot.png

libraries:
  - moni2026/base
  - moni2026/messages
  - core/normalize
  - moni2026/global

libraries-extend:
  user/drupal.user:
    - moni2026/user
  core/drupal.dropbutton:
    - moni2026/dropbutton
  core/drupal.dialog:
    - moni2026/dialog
  file/drupal.file:
    - moni2026/file
  core/drupal.progress:
    - moni2026/progress

ckeditor5-stylesheets:
  - css/ck5style.css

regions:
  header: Header
  nav_branding: 'Navigation branding region'
  nav_main: 'Main navigation region'
  nav_additional: 'Additional navigation region (eg search form, social icons, etc)'
  breadcrumb: Breadcrumbs
  front_first: 'Front first'
  front_second: 'Front second'
  front_third: 'Front third'
  content: 'Main content'
  sidebar_first: 'Sidebar first'
  sidebar_second: 'Sidebar second'
  footer: Footer
